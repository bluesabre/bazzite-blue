# Bazzite Blue development boxes.
# Create with: ujust setup-dev-box [gtk-dev|rust-dev|flutter-dev|all]
# or:          distrobox assemble create --file /usr/share/bazzite-blue/distrobox/dev.ini --name <box>
# See https://distrobox.it/usage/distrobox-assemble/

# GTK development in C, Vala and Python
[gtk-dev]
image=ghcr.io/ublue-os/fedora-toolbox:latest
nvidia=true
pull=true
additional_packages="gcc meson ninja-build pkgconf vala gdb gettext"
additional_packages="glib2-devel gtk4-devel gtk3-devel libadwaita-devel gobject-introspection-devel"
additional_packages="python3-devel python3-gobject blueprint-compiler desktop-file-utils appstream"

# Rust via rustup (toolchain installs to ~/.cargo); GTK libs for gtk-rs
[rust-dev]
image=ghcr.io/ublue-os/fedora-toolbox:latest
nvidia=true
pull=true
additional_packages="rustup gcc clang pkgconf openssl-devel"
additional_packages="gtk4-devel libadwaita-devel"

# Flutter Linux desktop (SDK installs to ~/.local/share/flutter)
[flutter-dev]
image=ghcr.io/ublue-os/ubuntu-toolbox:latest
nvidia=true
pull=true
additional_packages="clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev"
additional_packages="git curl unzip xz-utils zip mesa-utils"
