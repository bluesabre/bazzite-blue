# Bazzite Blue development boxes.
# Create with: ujust setup-dev-box [gtk-dev|rust-dev|flutter-dev|ubuntu-pkg|debian-pkg|all]
# or:          distrobox assemble create --file /usr/share/bazzite-blue/distrobox/dev.ini --name <box>
# See https://distrobox.it/usage/distrobox-assemble/

# GTK development in C, Vala and Python
[gtk-dev]
image=ghcr.io/ublue-os/fedora-toolbox:latest
nvidia=true
pull=true
additional_packages="gcc meson ninja-build pkgconf vala gdb gettext"
additional_packages="glib2-devel gtk4-devel gtk3-devel libadwaita-devel gobject-introspection-devel"
additional_packages="python3-devel python3-gobject blueprint-compiler desktop-file-utils appstream"

# Rust via rustup (toolchain installs to ~/.cargo); GTK libs for gtk-rs
[rust-dev]
image=ghcr.io/ublue-os/fedora-toolbox:latest
nvidia=true
pull=true
additional_packages="rustup gcc clang pkgconf openssl-devel"
additional_packages="gtk4-devel libadwaita-devel"

# Flutter Linux desktop (SDK installs to ~/.local/share/flutter)
[flutter-dev]
image=ghcr.io/ublue-os/ubuntu-toolbox:latest
nvidia=true
pull=true
additional_packages="clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev"
additional_packages="git curl unzip xz-utils zip mesa-utils"

# Ubuntu packaging (pbuilder-dist, ubuntu-dev-tools, lintian, debuild).
# Pinned to the latest stable release; bump the tag when a new one ships.
[ubuntu-pkg]
image=docker.io/library/ubuntu:26.10
pull=true
# Own PID namespace so pbuilder can mount /proc in its chroots.
unshare_process=true
# tpm-udev's postinst tries to chown the host's /dev/tpm* and fails; mask it.
pre_init_hooks="mkdir -p /etc/tmpfiles.d && ln -sf /dev/null /etc/tmpfiles.d/tpm-udev.conf"
# Enable deb-src (for apt-get source) before distrobox's first apt update.
# Distrobox evaluates hooks twice, so the script is base64. It decodes to:
#   sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
# (Idempotent: once changed, the line no longer matches.)
pre_init_hooks="echo c2VkIC1pICdzL15UeXBlczogZGViJC9UeXBlczogZGViIGRlYi1zcmMvJyAvZXRjL2FwdC9zb3VyY2VzLmxpc3QuZC91YnVudHUuc291cmNlcwo= | base64 -d | sh"
# Rootless: sysfs can't be mounted and debootstrap can't create device nodes,
# so skip /sys and bind the real character devices into pbuilder chroots.
# Distrobox evaluates hooks twice, so the snippet is base64 to survive quoting.
# It decodes to:
#   # bazzite-blue: rootless distrobox settings
#   USESYSFS=no
#   BINDMOUNTS="/dev/null /dev/zero /dev/full /dev/random /dev/urandom"
# Regenerate with: printf '%s\n' <lines> | base64 -w0
init_hooks="grep -q bazzite-blue /etc/pbuilderrc || echo IyBiYXp6aXRlLWJsdWU6IHJvb3RsZXNzIGRpc3Ryb2JveCBzZXR0aW5ncwpVU0VTWVNGUz1ubwpCSU5ETU9VTlRTPSIvZGV2L251bGwgL2Rldi96ZXJvIC9kZXYvZnVsbCAvZGV2L3JhbmRvbSAvZGV2L3VyYW5kb20iCg== | base64 -d >> /etc/pbuilderrc"
additional_packages="ubuntu-dev-tools pbuilder debootstrap devscripts debhelper dh-make lintian"
additional_packages="build-essential fakeroot quilt git-buildpackage"

# Debian packaging against unstable (sid), with the same fixes as ubuntu-pkg.
[debian-pkg]
image=docker.io/library/debian:unstable
pull=true
# Own PID namespace so pbuilder can mount /proc in its chroots.
unshare_process=true
# tpm-udev's postinst tries to chown the host's /dev/tpm* and fails; mask it.
pre_init_hooks="mkdir -p /etc/tmpfiles.d && ln -sf /dev/null /etc/tmpfiles.d/tpm-udev.conf"
# Enable deb-src (base64, see ubuntu-pkg). Decodes to:
#   sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
pre_init_hooks="echo c2VkIC1pICdzL15UeXBlczogZGViJC9UeXBlczogZGViIGRlYi1zcmMvJyAvZXRjL2FwdC9zb3VyY2VzLmxpc3QuZC9kZWJpYW4uc291cmNlcwo= | base64 -d | sh"
# Same pbuilderrc snippet as ubuntu-pkg (USESYSFS=no, device BINDMOUNTS).
init_hooks="grep -q bazzite-blue /etc/pbuilderrc || echo IyBiYXp6aXRlLWJsdWU6IHJvb3RsZXNzIGRpc3Ryb2JveCBzZXR0aW5ncwpVU0VTWVNGUz1ubwpCSU5ETU9VTlRTPSIvZGV2L251bGwgL2Rldi96ZXJvIC9kZXYvZnVsbCAvZGV2L3JhbmRvbSAvZGV2L3VyYW5kb20iCg== | base64 -d >> /etc/pbuilderrc"
additional_packages="ubuntu-dev-tools pbuilder debootstrap devscripts debhelper dh-make lintian"
additional_packages="build-essential fakeroot quilt git-buildpackage ubuntu-keyring"
